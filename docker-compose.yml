services:
  postgres:
    image: postgres:14
    container_name: entrevista_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: entrevista
      TZ: America/Campo_Grande
    ports:
      - "5432:5432"
    volumes:
      - ./storage/database:/var/lib/postgresql/data
      